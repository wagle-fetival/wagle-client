# GitHub에서 보이는 이 작업의 이름
name: CI

# 언제 실행할지
on:
  # develop이나 main으로 PR을 열거나, PR에 커밋을 추가로 push할 때
  pull_request:
    branches: [develop, main]
  # develop에 직접 반영(머지)됐을 때
  push:
    branches: [develop]

jobs:
  # 작업 이름 (PR 화면에 표시됨)
  check:
    # GitHub이 빌려주는 리눅스 컴퓨터에서 실행
    runs-on: ubuntu-latest

    # 위에서부터 순서대로 실행, 하나라도 실패하면 거기서 멈추고 ❌ 표시
    steps:
      # 1. 레포 코드를 그 컴퓨터로 내려받기
      - name: 코드 가져오기
        uses: actions/checkout@v5

      # 2. Node.js 설치 (Vite가 22 이상을 지원해서 22 사용)
      - name: Node.js 설치
        uses: actions/setup-node@v5
        with:
          node-version: 22
          # 다음 실행부터 설치를 빠르게 하려고 npm 패키지를 저장해 둠
          cache: npm

      # 3. 패키지 설치 (package-lock.json에 적힌 버전 그대로 설치)
      - name: 패키지 설치
        run: npm ci

      # 4. ESLint 검사
      - name: Lint 검사
        run: npm run lint

      # 5. Prettier 규칙에 맞는지 검사
      - name: 포맷 검사
        run: npm run format:check

      # 6. 실제로 빌드가 되는지 확인
      - name: 빌드
        run: npm run build
